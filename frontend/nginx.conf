# --- TLS (default) ---
# FluxFang ships with TLS enabled by default (FF-002). Place your cert and
# key at the paths below (or bind-mount them via docker-compose volumes)
# and the HTTPS listener on port 8443 serves the app. The HTTP listener on
# 8081 redirects all traffic to HTTPS.
#
# For local development without TLS, set FLUXFANG_INSECURE_DEV=true in
# .env — the HTTP-only block below still works, and the backend drops the
# Secure cookie flag so sessions function over plain HTTP.

# --- HTTPS listener (enabled when certs are present) ---
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # HSTS: tell browsers to only use HTTPS for this host going forward.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- HTTP listener ---
# When TLS certs are present, this redirects to HTTPS. When running in
# insecure dev mode (no certs mounted), nginx ignores the ssl server block
# above (it fails to start if certs are missing, so the Dockerfile ships a
# fallback conf — see below) and this block serves the app directly.
server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirect to HTTPS when TLS is available. The $https variable is "on"
    # only when the request arrived over SSL, which never happens on this
    # port — so this always redirects when the TLS block is active. In
    # insecure-dev mode (TLS block absent), this condition never fires.
    set $do_redirect "";
    if (-f /etc/nginx/tls/cert.pem) {
        set $do_redirect "yes";
    }
    if ($do_redirect = "yes") {
        return 301 https://$host:8443$request_uri;
    }

    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Stopping a wifi monitor source is a hardware teardown: it joins the
        # capture and channel-hopper threads, then shells out to `ip`/`iw` to
        # restore managed mode, which on some drivers takes far longer than
        # nginx's default 60s read timeout. A 504 mid-teardown used to leave
        # the source's row stuck at "running" (the backend is now resilient to
        # that -- see `CaptureSupervisor::stop` -- but the request should not
        # be failing in the first place).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Long-lived live-stream websockets outlive nginx's default 60s
        # read/send timeout; keep them open indefinitely-ish.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
